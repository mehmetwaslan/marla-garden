name: IndexNow
# Tells Bing (and other IndexNow search engines) about new or changed pages.
# - marlagarden.co.uk: pages changed in each push
# - marlastone.co.uk (Framer): new sitemap URLs, checked once a day
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/indexnow-state/**'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Submit URLs
        env:
          EVENT: ${{ github.event_name }}
        run: python3 .github/indexnow.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain .github/indexnow-state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/indexnow-state
            git commit -m "IndexNow state [skip ci]"
            git pull --rebase origin main
            git push
          fi
